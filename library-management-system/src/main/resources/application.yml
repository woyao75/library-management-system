spring:
  application:
    name: library-management-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_management_system
    username: root
    password: 123456

mybatis-plus:
  configuration:
    # MyBatis 日志输出配置
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名开关
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: library
      packages-to-scan: com.woyao.librarymanagementsystem.controller
      paths-to-match:
        - /categories/**
        - /books/**

security:
  jwt:
    # 启动前设置 JWT_SECRET 环境变量。密钥至少为 32 字节。
    secret: ${JWT_SECRET}
    ttl-seconds: 3600
